# Hardware FPU. The control plan is f32 throughout; double precision is present
# on this part (fpu_dp=1, established by the bring-up probe) but unused.
CONFIG_FPU=y

# Cycle-accurate step timing. The bring-up probe drove the DWT registers
# directly and its own notes recommend against doing that here: this API is
# DWT-backed on Cortex-M but portable to cores whose DWT is laid out
# differently, and it is a supported interface rather than a poke at 0xE0001000.
CONFIG_TIMING_FUNCTIONS=y

# The trace buffer is ~68 KB of .bss and deliberately NOT in DTCM - see main.c.
CONFIG_MAIN_STACK_SIZE=2048

# Caches stay at their defaults (on). The probe measured them as free, but only
# for a DTCM-resident working set; this application is the first thing here with
# a cacheable one, which is exactly why caches-off.conf exists next to this file.

# The control step runs in its own thread and main() also touches floats, so the
# FPU has two users. Without this, Zephyr does not preserve the callee-saved FP
# registers (s16-s31) across a context switch and the two contexts silently
# corrupt each other - Cortex-M lazy stacking only covers s0-s15.
CONFIG_FPU_SHARING=y
