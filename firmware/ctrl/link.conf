# The control app talking over the MCU-to-MCU link.
#
# Pulled in by -DCTRL_LINK=y, which also swaps ctrl_io_none.c for
# ctrl_io_link.c and compiles firmware/link's transceiver into this build.
# Without it the control core has no channels at all and an Input block reads
# its declared default - see src/ctrl_io_none.c.
#
# Everything here is the same set firmware/link/prj.conf carries and for the
# same reasons; that file is the one with the argument written out. The short
# version: the async API takes the receive deadline off the CPU, and the STM32
# driver refuses any DMA buffer it cannot prove non-cacheable, transmit
# included, so the ring lives in the MPU-backed nocache section rather than the
# D-cache being switched off.
CONFIG_SERIAL=y
CONFIG_UART_ASYNC_API=y
CONFIG_DMA=y
CONFIG_ARM_MPU=y
CONFIG_NOCACHE_MEMORY=y
