# Kernel tick fast enough to schedule a control period shorter than one step.
#
# k_timer resolution is the kernel tick, so at the default 10 kHz the shortest
# period available is 100 us - comfortably longer than the ~19 us step, which
# means the missed-deadline path can never be reached. 100 kHz makes a 10 us
# period expressible, and 10 us is shorter than a step by design.
#
#   VARIANT=deadline EXTRA_CONF=fast-tick.conf \
#     bash firmware/scripts/build.sh ctrl nucleo_f767zi -p always -- -DCTRL_TICK_NS=10000
CONFIG_SYS_CLOCK_TICKS_PER_SEC=100000
