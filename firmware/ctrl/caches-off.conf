# A/B fragment: the same runtime with both L1 caches disabled.
#
#   VARIANT=caches-off EXTRA_CONF=caches-off.conf \
#     bash firmware/scripts/build.sh ctrl nucleo_f767zi -p always
#
# The bring-up probe found caches cost nothing, but its working set was entirely
# in DTCM, which is never cached - so that result says nothing about this
# application, whose trace buffer lives in ordinary SRAM. PROJECT_STATUS.md
# carries "re-run the cache A/B once the runtime touches sram0" as an open item;
# this fragment is the other half of that run.
#
# The trace digest must be identical either way. If it is not, the caches are
# not the cause - nothing here reads uninitialised or DMA'd memory - and the
# real bug is elsewhere. What may legitimately change is the timing.
CONFIG_ICACHE=n
CONFIG_DCACHE=n
