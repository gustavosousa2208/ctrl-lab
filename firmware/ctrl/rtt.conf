# Console over SEGGER RTT, for the WeAct MiniSTM32H743.
#
#   EXTRA_CONF=rtt.conf bash firmware/scripts/build.sh ctrl mini_stm32h743 -p always
#
# The board's default console is USB CDC ACM, which loses everything printed
# before enumeration and puts a USB device stack on the control path - the two
# things this project keeps off it. The NUCLEO-F767ZI needs none of this: its
# console is a hardware UART.
#
# All three settings are load-bearing, and each cost a debugging session on the
# bring-up probe. firmware/BRINGUP.md has the full account.
CONFIG_USE_SEGGER_RTT=y
CONFIG_RTT_CONSOLE=y
CONFIG_UART_CONSOLE=n

# DTCM is never cached. Without this the Cortex-M7 D-cache holds the RTT writes
# and the debug probe, reading physical SRAM through the AHB-AP, sees a control
# block whose magic string is present but whose MaxNumUpBuffers reads 0.
CONFIG_SEGGER_RTT_SECTION_DTCM=y

# Big enough for a whole binary trace frame plus the surrounding text. A
# 501-step, 3-signal frame is 8060 bytes; 16 KB leaves room for wider plans.
# DTCM is 128 KB, so this is cheap.
CONFIG_SEGGER_RTT_BUFFER_SIZE_UP=16384
