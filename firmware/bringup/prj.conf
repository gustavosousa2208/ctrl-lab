# Hardware FPU. The M7 in the STM32H743 has an FPv5-D16 unit, so both f32 and
# f64 run in hardware; the control plan uses f32 for footprint, not for speed.
CONFIG_FPU=y

# Caches are ON by default on this part (the SoC selects CPU_HAS_ICACHE and
# CPU_HAS_DCACHE for Cortex-M7, and both CONFIG_ICACHE and CONFIG_DCACHE
# default to y). They are the main determinism hazard here: execution time
# becomes history-dependent. To measure what they cost, rebuild with
#   CONFIG_ICACHE=n
#   CONFIG_DCACHE=n
# and compare the reported jitter. Both variants are known to build.
