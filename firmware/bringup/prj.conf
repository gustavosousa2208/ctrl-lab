# Hardware FPU.
#
# The Cortex-M7 in the STM32F767 has an FPv5-D16 unit, so the silicon is
# capable of double precision. Zephyr does not expose it:
# soc/st/stm32/stm32f7x/Kconfig selects CPU_HAS_FPU but *not*
# CPU_HAS_FPU_DOUBLE_PRECISION -- the H7 series Kconfig does select it, which
# is why the earlier H743 notes claimed f64 was free. That symbol is promptless
# (arch/Kconfig), so it is select-only and cannot be enabled from here.
#
# Consequence on this board: `float` is hardware, `double` is soft-emulated.
# The control plan is f32 end to end so this costs us nothing directly, but a
# stray double in a kernel -- a bare `0.1` literal instead of `0.1f`, `sin()`
# instead of `sinf()` -- silently becomes a soft-float library call with
# unbounded WCET. That is a determinism bug, not just a slow path.
CONFIG_FPU=y

# Caches are ON by default on this part too: soc/st/stm32/stm32f7x/Kconfig
# selects CPU_HAS_ICACHE and CPU_HAS_DCACHE, and arch/Kconfig defaults both
# CONFIG_ICACHE and CONFIG_DCACHE to y. Same determinism hazard as the H743:
# execution time becomes history-dependent. To measure what they cost, rebuild
# with
#   CONFIG_ICACHE=n
#   CONFIG_DCACHE=n
# and compare the reported spread.
#
# The F7 adds a second history-dependent accelerator the H7 does not have in
# the same form: the ART accelerator in front of flash (HAS_STM32_FLASH_PREFETCH).
# At 216 MHz flash needs 7 wait states, so ART is doing real work on every
# instruction fetch that misses I-cache.
