# Hardware FPU, double precision included.
#
# soc/st/stm32/stm32f7x/Kconfig selects only CPU_HAS_FPU, which looks like the
# F7 lacks the double-precision unit that the H7 series Kconfig selects
# explicitly. That reading is wrong: the series Kconfig.defconfig ends with
# `rsource "Kconfig.defconfig.stm32f7*"`, and the per-die
# Kconfig.defconfig.stm32f767xx adds CPU_HAS_FPU_DOUBLE_PRECISION. Confirmed
# twice over -- CONFIG_CPU_HAS_FPU_DOUBLE_PRECISION=y in the generated .config,
# and the probe prints fpu_dp=1 on the board.
#
# So both f32 and f64 run in hardware here, as on the H743. The control plan
# stays f32 for footprint, not for speed.
CONFIG_FPU=y

# Caches are ON by default: soc/st/stm32/stm32f7x/Kconfig selects CPU_HAS_ICACHE
# and CPU_HAS_DCACHE, and arch/Kconfig defaults CONFIG_ICACHE and CONFIG_DCACHE
# to y.
#
# Measured on hardware 2026-09-06, and the answer was "no difference at all":
# the caches-off variant (caches-off.conf) produced bit-identical timings,
# first=1670 best=1653 worst=1670, spread 17 cycles either way.
#
# Two reasons, and both are properties of how we build rather than luck:
#   - the hot pools live in DTCM, which is never cached, so D-cache has nothing
#     to do with the working set;
#   - CONFIG_STM32_FLASH_PREFETCH=y in both variants, and the F7's ART
#     accelerator sits in front of flash independently of the Cortex-M7 L1
#     caches, so it already covers a tight loop's instruction fetch.
#
# Do not generalize this to the real control runtime. The probe never touches
# cacheable memory, so it cannot say what D-cache costs once the trace buffer
# and plan structures live in sram0. Re-run the A/B then. See BRINGUP.md.
