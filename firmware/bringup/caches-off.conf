# The caches-off half of the determinism A/B.
#
# Build with:
#   VARIANT=caches-off EXTRA_CONF=caches-off.conf \
#     bash firmware/scripts/build.sh bringup nucleo_f767zi -p always
#
# Read the result against the default build's spread. Do not assume caches-off
# is the more deterministic option: a fully cached build can have both lower
# mean and lower spread once the working set is hot. The point is the number.
CONFIG_ICACHE=n
CONFIG_DCACHE=n
