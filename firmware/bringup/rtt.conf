# Console over SEGGER RTT instead of the board's USB CDC ACM.
#
#   EXTRA_CONF=rtt.conf bash firmware/scripts/build.sh bringup mini_stm32h743 -p always
#
# Why RTT here and not on the Nucleo: mini_stm32h743.dts pulls in
# boards/common/usb/cdc_acm_serial.dtsi and puts the console on USB CDC ACM,
# which has the two problems the F7's hardware UART does not - output before
# enumeration is lost, and a USB device stack ends up on the control path. RTT
# needs neither: the target writes into a ring buffer in RAM and the debug probe
# reads it out over SWD, so there is no device stack and nothing to enumerate.
#
# It costs a working SWD connection, which the USB CDC path does not.
CONFIG_USE_SEGGER_RTT=y
CONFIG_RTT_CONSOLE=y
CONFIG_UART_CONSOLE=n

# The probe prints once at boot and then idles, and the host attaches after the
# flash-and-run, so the whole boot transcript has to survive in the ring buffer
# until someone reads it. The default is 1024 bytes, which truncates it.
#
# The mode stays the default NO_BLOCK_SKIP on purpose: BLOCK_IF_FIFO_FULL would
# stall the target forever whenever no debugger is attached, which is a fine way
# to make a control loop hang on a bench with no host.
CONFIG_SEGGER_RTT_BUFFER_SIZE_UP=8192

# Without this the board becomes unreachable the moment the probe finishes.
#
# STM32 parts gate the DBGMCU off in sleep/stop mode to save power. Zephyr's
# idle thread executes WFI as soon as main() returns, the debug port goes with
# it, and J-Link then reports "Failed to initialized DAP" on every subsequent
# attach - the board looks bricked and is not. Learned the hard way on the H743:
# it connected fine before the first flash and refused every attach after it.
#
# Zephyr's own Kconfig help is explicit that this is required here: "this
# prevents debuggers from attaching w/o resetting the target... Also SEGGER RTT
# and similar technologies need this."
#
# The F767 never hit this because its console is a UART that needs no debug
# connection to read. RTT reads target RAM over SWD, so the debug port has to
# survive idle.
CONFIG_STM32_ENABLE_DEBUG_SLEEP_STOP=y

# Put the RTT control block and buffers in DTCM, which is never cached.
#
# Without this the probe reads zeros. The Cortex-M7 D-cache is on by default,
# so the target's RTT writes sit in cache while the debugger reads physical SRAM
# through the AHB-AP and never sees them. The symptom is precise and misleading:
# the "SEGGER RTT" magic string appears at _SEGGER_RTT (one cache line happened
# to be evicted) while MaxNumUpBuffers right after it still reads 0, so
# JLinkRTTLogger reports "RTT Control Block not found" even though the block is
# plainly there in memory. Measured on this board 2026-09-06.
#
# DTCM is the natural home: it is exactly why this project already puts the
# signal and state pools there. The default here is SECTION_CUSTOM, which places
# the block at RAM start - still cacheable, so still wrong on this part.
CONFIG_SEGGER_RTT_SECTION_DTCM=y
