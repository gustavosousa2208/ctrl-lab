# The link is polled, not interrupt-driven.
#
# Interrupt-driven UART would be faster to write and worse to measure: the
# thing being measured is transport delay, and an ISR plus a ring buffer adds
# scheduling variance on top of the wire. uart_poll_in/out is a busy loop that
# touches the peripheral directly, so what comes out is the wire plus a few
# instructions rather than the wire plus Zephyr's driver stack.
#
# (Interrupt-driven UART is left at its default rather than forced off: some
# shields select it, and an explicit =n only produces a Kconfig warning. Nothing
# here registers a callback, so the driver stays out of the measured path.)
CONFIG_SERIAL=y

# Cycle-accurate timing, same DWT-backed API the control runtime uses.
CONFIG_TIMING_FUNCTIONS=y

CONFIG_MAIN_STACK_SIZE=4096
