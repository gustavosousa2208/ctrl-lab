# The link receives by DMA, not by polling.
#
# E2 measured the polled path to its limit. uart_poll_in has to be called again
# before the next byte lands - 1.7 us at 6 Mbaud - and the 10 kHz kernel tick
# ISR is longer than that, so the poll loop lost one to three bytes per frame,
# sporadically. irq_lock() around the whole frame made it deterministic, and
# that is precisely what E3 cannot do: a control loop cannot go deaf for 40 ms,
# and locking interrupts would suppress the jitter this stage exists to
# measure. See bead ctrl-lab-b7r.7 for the decision and the alternatives.
#
# The async API moves the deadline off the CPU entirely: the DMA controller
# writes bytes into RAM on its own and the driver only wakes at buffer
# boundaries, so a late thread costs latency instead of data.
CONFIG_SERIAL=y
CONFIG_UART_ASYNC_API=y

# UART_ASYNC_API already selects DMA (drivers/serial/Kconfig.stm32:18), but the
# DMA controllers still have to be enabled per board in the overlays. Stating
# it here as well means a build that somehow loses an overlay fails on a
# missing controller rather than quietly falling back to something slower.
CONFIG_DMA=y

# The DMA ring must not be cached. Both parts are Cortex-M7 with D-cache on by
# default, and the STM32 async UART driver does no cache maintenance of its
# own - upstream's own async_api sample works around this by setting
# CONFIG_DCACHE=n on both nucleo_f746zg and nucleo_h753zi.
#
# Switching the cache off is the wrong trade here: firmware/ctrl/README.md
# measured what it buys on the H743, and E3 wants that. So instead the ring
# goes in the MPU-backed nocache section and the rest of RAM stays cacheable.
CONFIG_ARM_MPU=y
CONFIG_NOCACHE_MEMORY=y

# Cycle-accurate timing, same DWT-backed API the control runtime uses.
CONFIG_TIMING_FUNCTIONS=y

CONFIG_MAIN_STACK_SIZE=4096
